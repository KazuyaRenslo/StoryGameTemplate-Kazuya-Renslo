<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>

  </head>
  <body>
    <div class="container">
      <div class="text-bg-warning p-3">
    <h1 class="display-1" >Lost Man - Isaac Man</h1>
    </div>
    <p class="text-center" >Description: 5,0ft 110 pounds, straight hair, black, red eyes</p>
    <p class="text-center" >Loves playing video games, 12 concussions(dont hit on head), fears heights</p>
    <p class="text-center" ><span class="border border-primary">If found call his mother, and scold him</span></div>
    </div>
    <a class="btn btn-primary" href="https://u.gg/" role="button">Isaacs game site</a>
    <button type="button" class="btn btn-success">Success</button>
    <div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="WIN_20261104_11_09_29_Pro.jpg" class="d-block w-100" alt="isaac man">
    </div>
    <div class="carousel-item">
      <img src="WIN_20261104_11_12_29_Pro.jpg" class="d-block w-100" alt="isaac man">
    </div>
    <div class="carousel-item">
      <img src="reward.jpg" class="d-block w-100" alt="isaac man">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
<select class="form-select form-select-lg mb-3" aria-label="Large select example">
  <option selected>Status</option>
  <option value="1">Not found</option>
  <option value="2">Looking</option>
  <option value="3">Found</option>
</select>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
